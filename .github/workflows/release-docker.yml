name: Release container images

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: simba-avionic

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-proxy:
    name: proxy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vMAJOR.MINOR.PATCH, got: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "semver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: proxy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/srp-app-proxy:${{ steps.version.outputs.semver }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/srp-app-proxy:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/srp-app-proxy:latest
          labels: |
            org.opencontainers.image.title=srp-app-proxy
            org.opencontainers.image.description=SRP-App SOME/IP proxy and API server
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,mode=max,scope=proxy

  build-desktop:
    name: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "semver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: desktop/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/srp-app-desktop:${{ steps.version.outputs.semver }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/srp-app-desktop:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/srp-app-desktop:latest
          labels: |
            org.opencontainers.image.title=srp-app-desktop
            org.opencontainers.image.description=SRP-App Flutter web UI served by nginx
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=desktop
          cache-to: type=gha,mode=max,scope=desktop

  release-summary:
    name: summary
    needs:
      - build-proxy
      - build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Write job summary
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "## Container release ${GITHUB_REF_NAME}"
            echo ""
            echo "Images published to GitHub Container Registry:"
            echo ""
            echo "| Service | Pull command |"
            echo "|---------|--------------|"
            echo "| proxy | \`docker pull ghcr.io/simba-avionic/srp-app-proxy:${version}\` |"
            echo "| desktop | \`docker pull ghcr.io/simba-avionic/srp-app-desktop:${version}\` |"
            echo ""
            echo "Packages are linked to [Simba-Avionic/srp-app](https://github.com/Simba-Avionic/srp-app)."
          } >> "$GITHUB_STEP_SUMMARY"
