services:
  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    container_name: srp-proxy
    # Host network wymagany dla SOME/IP UDP multicast na interfejsie fizycznym (RPi/LAN).
    # Desktop łączy się przez host.docker.internal:5000.
    network_mode: host
    volumes:
      - ./desktop/data/csv:/app/desktop/data/csv
      - ./logs:/app/logs
    cap_add:
      - NET_ADMIN
    environment:
      MULTICAST_GROUP: ${MULTICAST_GROUP:-224.224.224.245}
      INTERFACE_IP: ${INTERFACE_IP:-192.168.10.49}
      INTERFACE_IP_FINAL: ${INTERFACE_IP_FINAL:-10.101.0.1}
      SD_PORT: ${SD_PORT:-30490}
      NEXT_PORT: ${NEXT_PORT:-10260}
    restart: unless-stopped

  desktop:
    build:
      context: .
      dockerfile: desktop/Dockerfile
    container_name: srp-desktop
    ports:
      - "${DESKTOP_PORT:-8080}:80"
    environment:
      PROXY_UPSTREAM: "host.docker.internal:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - proxy
    restart: unless-stopped
