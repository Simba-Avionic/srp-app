services:
  proxy:
    image: ghcr.io/simba-avionic/srp-app-proxy:latest
    build:
      context: .
      dockerfile: proxy/Dockerfile
    container_name: srp-proxy
    network_mode: host
    volumes:
      - ${CSV_DATA_DIR}:/app/desktop/data/csv
      - ${LOGS_DIR}:/app/logs
    cap_add:
      - NET_ADMIN
    environment:
      MULTICAST_GROUP: ${MULTICAST_GROUP}
      INTERFACE_IP: ${INTERFACE_IP}
      SD_PORT: ${SD_PORT}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped

  desktop:
    image: ghcr.io/simba-avionic/srp-app-desktop:latest
    build:
      context: .
      dockerfile: desktop/Dockerfile
    container_name: srp-desktop
    ports:
      - "${DESKTOP_PORT}:80"
    environment:
      PROXY_UPSTREAM: host.docker.internal:5000
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - proxy
    restart: unless-stopped
