# Uruchomienie z obrazów opublikowanych przez release (tag v1.2.3).
# Wymaga: docker login ghcr.io -u <user> -p <token>

services:
  proxy:
    image: ghcr.io/simba-avionic/srp-app-proxy:${SRP_VERSION:-latest}
    container_name: srp-proxy
    network_mode: host
    volumes:
      - ./desktop/data/csv:/app/desktop/data/csv
      - ./logs:/app/logs
    cap_add:
      - NET_ADMIN
    environment:
      MULTICAST_GROUP: ${MULTICAST_GROUP:-224.224.224.245}
      INTERFACE_IP: ${INTERFACE_IP:-192.168.10.49}
      INTERFACE_IP_FINAL: ${INTERFACE_IP_FINAL:-10.101.0.1}
      SD_PORT: ${SD_PORT:-30490}
      NEXT_PORT: ${NEXT_PORT:-10260}
    restart: unless-stopped

  desktop:
    image: ghcr.io/simba-avionic/srp-app-desktop:${SRP_VERSION:-latest}
    container_name: srp-desktop
    ports:
      - "${DESKTOP_PORT:-8080}:80"
    environment:
      PROXY_UPSTREAM: "host.docker.internal:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - proxy
    restart: unless-stopped
